[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlt-fabric-ingestion-pipeline"
version = "0.1.0"
description = "Production-grade, config-driven data ingestion pipeline from DummyJSON API to Microsoft Fabric OneLake using dlt"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "dlt[duckdb]>=0.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pyarrow>=14.0.0",
    "adlfs>=2024.2.0",
    "azure-identity>=1.15.0",
    "deltalake>=0.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
